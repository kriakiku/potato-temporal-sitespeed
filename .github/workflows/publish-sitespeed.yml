name: Publish sitespeed image

# Manual only — builds sitespeedio/sitespeed.io + Noto fonts and pushes to GHCR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kriakiku/potato-sitespeed.io
  TAG: 40.0.0-plus1

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sitespeed
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sitespeed-fonts
          cache-to: type=gha,mode=max,scope=sitespeed-fonts

      - name: Verify Bengali fonts in image
        run: |
          docker pull "${IMAGE}:${TAG}"
          docker run --rm --entrypoint bash "${IMAGE}:${TAG}" -c \
            'fc-list :lang=bn | head -20'
          docker run --rm --entrypoint bash "${IMAGE}:${TAG}" -c \
            'fc-list :lang=bn | grep -qi bengali'

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Public repo companion image — hosts/CI can pull without auth.
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${IMAGE##*/}/visibility" \
            -f visibility=public
