name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: potato-temporal-sitespeed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image contains browsertime scripts
        run: |
          id=$(docker create potato-temporal-sitespeed:ci)
          docker cp "$id:/app/scripts/bt-first-iframe.js" /tmp/bt-first-iframe.js
          docker cp "$id:/app/scripts" /tmp/potato-scripts-check
          docker rm "$id"
          test -f /tmp/bt-first-iframe.js
          test -f /tmp/potato-scripts-check/bt-first-iframe.js
          echo "scripts/ present in image"